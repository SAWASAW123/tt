<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыкальный плеер</title>
    <style>
        /* Базовые стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* Основной контейнер плеера */
        .music-player {
            width: 100%;
            max-width: 900px;
            background: rgba(30, 30, 46, 0.9);
            border-radius: 15px;
            padding: 20px;
            position: relative;
        }
        
        /* Обертка для основных блоков */
        .player-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            position: relative;
            z-index: 2;
        }
        
        /* Левый блок - информация о треке */
        .left-block {
            flex: 1;
            min-width: 250px;
        }
        
        .track-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .album-cover-small {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        
        .album-cover-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .track-details {
            flex: 1;
        }
        
        .track-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .artist-name {
            font-size: 14px;
            color: #a0a0c0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Центральный блок - управление воспроизведением */
        .center-block {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        
        .playback-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        
        .play-btn {
            width: 40px;
            height: 40px;
            background: #4f6df5;
            color: white;
        }
        
        .play-btn:hover {
            background: #3a5af5;
            transform: scale(1.05);
        }
        
        /* Правый блок - дополнительные настройки */
        .right-block {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 20px;
            min-width: 250px;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            max-width: 150px;
        }
        
        .volume-slider {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        
        .volume-level {
            height: 100%;
            width: 70%;
            background: #4f6df5;
            border-radius: 2px;
            position: relative;
        }
        
        .additional-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .extra-btn {
            background: none;
            border: none;
            color: #a0a0c0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .extra-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .extra-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        /* Таймлайн */
        .timeline-block {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1;
        }
        
        .timeline-container {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #a0a0c0;
            margin-bottom: 8px;
        }
        
        .timeline {
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
            margin-bottom: 5px;
        }
        
        .progress {
            height: 100%;
            background: #4f6df5;
            border-radius: 2px;
            width: 0%;
            position: relative;
            transition: width 0.1s;
        }
        
        .progress-handle {
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.2s;
            cursor: grab;
        }
        
        .timeline:hover .progress-handle,
        .progress-handle.dragging {
            opacity: 1;
        }
        
        /* Классы для смены цвета */
        .theme-blue {
            --primary-color: #4f6df5;
            --primary-hover: #3a5af5;
            --secondary-color: #a855f7;
        }
        
        .theme-red {
            --primary-color: #ff6b6b;
            --primary-hover: #ff5252;
            --secondary-color: #ff9f43;
        }
        
        .theme-green {
            --primary-color: #1dd1a1;
            --primary-hover: #10ac84;
            --secondary-color: #54a0ff;
        }
        
        .theme-purple {
            --primary-color: #a855f7;
            --primary-hover: #9333ea;
            --secondary-color: #4f6df5;
        }
        
        /* Применение цветовых тем */
        .theme-blue .play-btn,
        .theme-blue .progress,
        .theme-blue .volume-level {
            background: var(--primary-color);
        }
        
        .theme-red .play-btn,
        .theme-red .progress,
        .theme-red .volume-level {
            background: var(--primary-color);
        }
        
        .theme-green .play-btn,
        .theme-green .progress,
        .theme-green .volume-level {
            background: var(--primary-color);
        }
        
        .theme-purple .play-btn,
        .theme-purple .progress,
        .theme-purple .volume-level {
            background: var(--primary-color);
        }
        
        .theme-blue .play-btn:hover {
            background: var(--primary-hover);
        }
        
        .theme-red .play-btn:hover {
            background: var(--primary-hover);
        }
        
        .theme-green .play-btn:hover {
            background: var(--primary-hover);
        }
        
        .theme-purple .play-btn:hover {
            background: var(--primary-hover);
        }
        
        /* Кнопки выбора темы */
        .theme-selector {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 5px;
        }
        
        .theme-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }
        
        .theme-btn.blue { background: #4f6df5; }
        .theme-btn.red { background: #ff6b6b; }
        .theme-btn.green { background: #1dd1a1; }
        .theme-btn.purple { background: #a855f7; }
        
        .theme-btn.active {
            border-color: white;
            transform: scale(1.1);
        }
        
        /* Аудио элемент */
        .hidden-audio {
            display: none;
        }
        
        /* Состояния кнопок */
        .active {
            color: var(--primary-color, #4f6df5) !important;
        }
        
        .playing .play-btn {
            background: var(--primary-hover, #3a5af5);
        }
    </style>
</head>
<body>
    <!-- Аудио элемент -->
    <audio id="audio-element" class="hidden-audio" preload="metadata">
        <!-- ВАША ССЫЛКА НА МУЗЫКАЛЬНЫЙ ФАЙЛ -->
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    
    <div class="music-player theme-blue" id="music-player">
        <!-- Основные блоки -->
        <div class="player-content">
            <!-- Левый блок - информация о треке -->
            <div class="left-block">
                <div class="track-info">
                    <div class="album-cover-small">
                        <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Обложка">
                    </div>
                    <div class="track-details">
                        <div class="track-title" id="track-title">Bohemian Rhapsody</div>
                        <div class="artist-name" id="artist-name">Queen</div>
                    </div>
                </div>
            </div>
            
            <!-- Центральный блок - управление воспроизведением -->
            <div class="center-block">
                <div class="playback-controls">
                    <button class="control-btn" id="prev-btn" title="Предыдущий трек">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    
                    <button class="control-btn play-btn" id="play-btn" title="Воспроизвести">
                        <svg viewBox="0 0 24 24" id="play-icon">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg viewBox="0 0 24 24" id="pause-icon" style="display: none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>
                    
                    <button class="control-btn" id="next-btn" title="Следующий трек">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                        </svg>
                    </button>
                </div>
            </div>
            
            <!-- Правый блок - дополнительные настройки -->
            <div class="right-block">
                <div class="volume-control">
                    <button class="control-btn" id="volume-btn" title="Громкость">
                        <svg viewBox="0 0 24 24" id="volume-icon">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                        </svg>
                    </button>
                    <div class="volume-slider" id="volume-slider">
                        <div class="volume-level" id="volume-level"></div>
                    </div>
                </div>
                
                <div class="additional-controls">
                    <button class="extra-btn" id="like-btn" title="Добавить в избранное">
                        <svg viewBox="0 0 24 24">
                            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                        </svg>
                    </button>
                    
                    <button class="extra-btn" id="repeat-btn" title="Повтор">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
                        </svg>
                    </button>
                    
                    <button class="extra-btn" id="shuffle-btn" title="Перемешать">
                        <svg viewBox="0 0 24 24">
                            <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Блок таймлайна -->
        <div class="timeline-block">
            <div class="timeline-container">
                <div class="time-display">
                    <span id="current-time">0:00</span>
                    <span id="total-time">0:00</span>
                </div>
                <div class="timeline" id="timeline">
                    <div class="progress" id="progress">
                        <div class="progress-handle" id="progress-handle"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Элементы DOM
        const audio = document.getElementById('audio-element');
        const player = document.getElementById('music-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const timeline = document.getElementById('timeline');
        const progress = document.getElementById('progress');
        const progressHandle = document.getElementById('progress-handle');
        const currentTimeEl = document.getElementById('current-time');
        const totalTimeEl = document.getElementById('total-time');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeLevel = document.getElementById('volume-level');
        const volumeBtn = document.getElementById('volume-btn');
        const trackTitle = document.getElementById('track-title');
        const artistName = document.getElementById('artist-name');
        
        // Кнопки управления
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const likeBtn = document.getElementById('like-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        
        // Состояние плеера
        const playerState = {
            isPlaying: false,
            duration: 0,
            currentTime: 0,
            volume: 0.7,
            isMuted: false,
            isDragging: false,
            isLiked: false,
            isRepeating: false,
            isShuffled: false
        };
        
        // Плейлист (для демонстрации)
        const playlist = [
            {
                title: "Bohemian Rhapsody",
                artist: "Queen",
                cover: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                title: "Hotel California",
                artist: "Eagles",
                cover: "https://images.unsplash.com/photo-1511379938547-c1f69419868d?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                title: "Imagine",
                artist: "John Lennon",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            }
        ];
        
        let currentTrackIndex = 0;
        
        // Инициализация плеера
        function initPlayer() {
            // Загружаем первый трек
            loadTrack(currentTrackIndex);
            
            // Устанавливаем начальную громкость
            audio.volume = playerState.volume;
            volumeLevel.style.width = `${playerState.volume * 100}%`;
            
            // Обновляем интерфейс при загрузке метаданных
            audio.addEventListener('loadedmetadata', function() {
                playerState.duration = audio.duration;
                totalTimeEl.textContent = formatTime(playerState.duration);
            });
            
            // Обновляем время при воспроизведении
            audio.addEventListener('timeupdate', updateProgressBar);
            
            // Обработка ошибок
            audio.addEventListener('error', function(e) {
                console.error('Ошибка аудио:', e);
                alert('Ошибка загрузки аудиофайла. Проверьте ссылку.');
            });
            
            // При окончании трека
            audio.addEventListener('ended', function() {
                if (playerState.isRepeating) {
                    audio.currentTime = 0;
                    audio.play();
                } else {
                    playNextTrack();
                }
            });
        }
        
        // Загрузка трека
        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            artistName.textContent = track.artist;
            document.querySelector('.album-cover-small img').src = track.cover;
            
            // Сброс состояния
            playerState.isPlaying = false;
            updatePlayButton();
            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            
            // Загружаем аудио
            audio.load();
        }
        
        // Форматирование времени
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
        
        // Обновление прогресс-бара
        function updateProgressBar() {
            if (!playerState.isDragging) {
                playerState.currentTime = audio.currentTime;
                const percent = (playerState.currentTime / playerState.duration) * 100 || 0;
                progress.style.width = `${percent}%`;
                currentTimeEl.textContent = formatTime(playerState.currentTime);
            }
        }
        
        // Управление воспроизведением
        function togglePlay() {
            if (playerState.isPlaying) {
                audio.pause();
                player.classList.remove('playing');
            } else {
                audio.play()
                    .then(() => {
                        player.classList.add('playing');
                    })
                    .catch(error => {
                        console.error('Ошибка воспроизведения:', error);
                        alert('Не удалось воспроизвести аудио. Возможно, файл недоступен.');
                    });
            }
            
            playerState.isPlaying = !playerState.isPlaying;
            updatePlayButton();
        }
        
        // Обновление кнопки play/pause
        function updatePlayButton() {
            if (playerState.isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
            }
        }
        
        // Перемотка по клику на таймлайн
        function seekToPosition(e) {
            const rect = timeline.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const percent = Math.max(0, Math.min(1, clickX / width));
            
            playerState.currentTime = percent * playerState.duration;
            audio.currentTime = playerState.currentTime;
            progress.style.width = `${percent * 100}%`;
            currentTimeEl.textContent = formatTime(playerState.currentTime);
        }
        
        // Перетаскивание прогресса
        function startDrag(e) {
            e.preventDefault();
            playerState.isDragging = true;
            progressHandle.classList.add('dragging');
            
            document.addEventListener('mousemove', handleDrag);
            document.addEventListener('mouseup', stopDrag);
        }
        
        function handleDrag(e) {
            if (!playerState.isDragging) return;
            
            const rect = timeline.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            clickX = Math.max(0, Math.min(clickX, rect.width));
            const percent = clickX / rect.width;
            
            progress.style.width = `${percent * 100}%`;
            playerState.currentTime = percent * playerState.duration;
            currentTimeEl.textContent = formatTime(playerState.currentTime);
        }
        
        function stopDrag() {
            if (playerState.isDragging) {
                playerState.isDragging = false;
                progressHandle.classList.remove('dragging');
                audio.currentTime = playerState.currentTime;
                
                document.removeEventListener('mousemove', handleDrag);
                document.removeEventListener('mouseup', stopDrag);
            }
        }
        
        // Управление громкостью
        function setVolume(e) {
            const rect = volumeSlider.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            clickX = Math.max(0, Math.min(clickX, rect.width));
            const percent = clickX / rect.width;
            
            playerState.volume = percent;
            audio.volume = percent;
            volumeLevel.style.width = `${percent * 100}%`;
            
            if (playerState.isMuted && percent > 0) {
                playerState.isMuted = false;
                updateVolumeIcon();
            }
            
            updateVolumeIcon();
        }
        
        function toggleMute() {
            playerState.isMuted = !playerState.isMuted;
            
            if (playerState.isMuted) {
                audio.volume = 0;
                volumeLevel.style.width = '0%';
            } else {
                audio.volume = playerState.volume;
                volumeLevel.style.width = `${playerState.volume * 100}%`;
            }
            
            updateVolumeIcon();
        }
        
        function updateVolumeIcon() {
            const volumeIcon = document.getElementById('volume-icon');
            let iconPath;
            
            if (playerState.isMuted || audio.volume === 0) {
                iconPath = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
            } else if (audio.volume < 0.5) {
                iconPath = 'M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z';
            } else {
                iconPath = 'M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z';
            }
            
            volumeIcon.innerHTML = `<path d="${iconPath}"/>`;
        }
        
        // Управление треками
        function playPrevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            if (playerState.isPlaying) {
                setTimeout(() => audio.play(), 100);
            }
        }
        
        function playNextTrack() {
            if (playerState.isShuffled) {
                currentTrackIndex = Math.floor(Math.random() * playlist.length);
            } else {
                currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            }
            loadTrack(currentTrackIndex);
            if (playerState.isPlaying) {
                setTimeout(() => audio.play(), 100);
            }
        }
        
        // Назначение обработчиков событий
        playBtn.addEventListener('click', togglePlay);
        
        timeline.addEventListener('click', seekToPosition);
        
        progressHandle.addEventListener('mousedown', startDrag);
        
        volumeSlider.addEventListener('click', setVolume);
        volumeBtn.addEventListener('click', toggleMute);
        
        prevBtn.addEventListener('click', playPrevTrack);
        nextBtn.addEventListener('click', playNextTrack);
        
        likeBtn.addEventListener('click', function() {
            playerState.isLiked = !playerState.isLiked;
            this.classList.toggle('active', playerState.isLiked);
        });
        
        repeatBtn.addEventListener('click', function() {
            playerState.isRepeating = !playerState.isRepeating;
            this.classList.toggle('active', playerState.isRepeating);
        });
        
        shuffleBtn.addEventListener('click', function() {
            playerState.isShuffled = !playerState.isShuffled;
            this.classList.toggle('active', playerState.isShuffled);
        });
        
        // Смена темы
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const theme = this.getAttribute('data-theme');
                
                // Удаляем все классы тем
                player.classList.remove('theme-blue', 'theme-red', 'theme-green', 'theme-purple');
                // Добавляем выбранную тему
                player.classList.add(theme);
                
                // Обновляем активную кнопку
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
            });
        });
        
        // Инициализация плеера
        initPlayer();
    </script>
</body>
</html>
